name: Spotter

on:
  push:
    branches: [main]
    paths: ['spotter/**', '.github/workflows/spotter.yml']
  pull_request:
    branches: [main]
    paths: ['spotter/**', '.github/workflows/spotter.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: spotter

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify
      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotter-reports
          path: |
            spotter/coach/build/reports/tests/
            spotter/build/reports/kover/
          retention-days: 14
