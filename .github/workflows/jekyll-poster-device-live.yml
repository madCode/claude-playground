name: Jekyll Poster device live check

# The app on an emulator against the real GitHub: two of the tester's blogs under two sign-ins
# (docs/TESTER_ACCOUNT.md), published to and heard live, then deleted. Keeps the request record
# for the several-blogs audit. Nightly, and by hand on any branch.
on:
  schedule:
    # 04:07 Pacific (summer time), after the live check's 03:37.
    - cron: '7 11 * * *'
  workflow_dispatch:
  # A change to the check itself runs it.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/jekyll-poster-device-live.yml'
      - 'jekyll-poster/app/src/androidTest/kotlin/com/app/jekyllposter/device/LiveOnTheDeviceTest.kt'

permissions:
  contents: read

concurrency:
  group: jekyll-poster-device-live
  cancel-in-progress: false

defaults:
  run:
    working-directory: jekyll-poster

jobs:
  device-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A blog under the tester's account and one under its organisation: two owners, two tokens.
      REPO_A: ${{ vars.TEST_BLOG_A }}
      TOKEN_A: ${{ secrets.TEST_BLOG_A_TOKEN }}
      REPO_B: ${{ vars.TEST_BLOG_ORG }}
      TOKEN_B: ${{ secrets.TEST_BLOG_ORG_TOKEN }}
    steps:
      - name: Check the tester's blogs are configured
        run: |
          for v in REPO_A TOKEN_A REPO_B TOKEN_B; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty: see docs/TESTER_ACCOUNT.md (TEST_BLOG_A and TEST_BLOG_ORG)."; exit 1; fi
          done
        working-directory: .
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # KVM is off by default on the runner, and the emulator is unusably slow without it.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish to two blogs from the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: jekyll-poster
          script: |
            adb shell svc power stayon true
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.app.jekyllposter.device.LiveOnTheDeviceTest "-Pandroid.testInstrumentationRunnerArguments.liveRepoA=$REPO_A" "-Pandroid.testInstrumentationRunnerArguments.liveTokenA=$TOKEN_A" "-Pandroid.testInstrumentationRunnerArguments.liveRepoB=$REPO_B" "-Pandroid.testInstrumentationRunnerArguments.liveTokenB=$TOKEN_B" || { adb logcat -d > app/build/device-logcat.txt; adb logcat -d -b crash; exit 1; }
      # The record goes into a public artifact: refuse it if either token is anywhere in it.
      - name: Check the request record holds no token
        id: scan
        if: always()
        run: |
          record=$(find app/build/outputs -name requests.jsonl | head -1)
          if [ -z "$record" ]; then echo "::warning::No request record came back."; exit 0; fi
          if grep -qF -e "$TOKEN_A" -e "$TOKEN_B" "$record"; then
            rm -f "$record"
            echo "::error::A token reached the request record; it was deleted, not uploaded."
            exit 1
          fi
          mkdir -p app/build/request-record && cp "$record" app/build/request-record/
          echo "$(wc -l < "$record") requests recorded, no token in them."
      - name: Keep the request record and the report
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: jekyll-poster-device-live
          path: |
            jekyll-poster/app/build/request-record/
            jekyll-poster/app/build/reports/androidTests/
            jekyll-poster/app/build/device-logcat.txt
          retention-days: 30
