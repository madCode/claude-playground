name: Jekyll Poster device live check

# The app on an emulator against the real GitHub: two of the tester's blogs under two sign-ins
# (docs/TESTER_ACCOUNT.md), published to and heard live, then deleted. Keeps the request record
# for the several-blogs audit. Nightly, and by hand on any branch.
on:
  schedule:
    # 04:07 Pacific (summer time), after the live check's 03:37.
    - cron: '7 11 * * *'
  workflow_dispatch:
  # A change to the check itself runs it.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/jekyll-poster-device-live.yml'
      - 'jekyll-poster/app/src/androidTest/kotlin/com/app/jekyllposter/device/LiveOnTheDeviceTest.kt'

permissions:
  contents: read

concurrency:
  group: jekyll-poster-device-live
  cancel-in-progress: false

defaults:
  run:
    working-directory: jekyll-poster

jobs:
  device-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A blog under the tester's account and one under its organisation: two owners, two tokens.
      REPO_A: ${{ vars.TEST_BLOG_A }}
      TOKEN_A: ${{ secrets.TEST_BLOG_A_TOKEN }}
      REPO_B: ${{ vars.TEST_BLOG_ORG }}
      TOKEN_B: ${{ secrets.TEST_BLOG_ORG_TOKEN }}
      # A WireGuard config from the tester's Proton account, for Only connect through a VPN.
      # Without it that test is skipped.
      WG_CONF: ${{ secrets.PROTON_WG_CONF }}
    steps:
      - name: Check the tester's blogs are configured
        run: |
          for v in REPO_A TOKEN_A REPO_B TOKEN_B; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty: see docs/TESTER_ACCOUNT.md (TEST_BLOG_A and TEST_BLOG_ORG)."; exit 1; fi
          done
        working-directory: .
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # KVM is off by default on the runner, and the emulator is unusably slow without it.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Fetch the WireGuard app
        if: env.WG_CONF != ''
        run: |
          apk=$(curl -fsSL https://download.wireguard.com/android-client/ | grep -o 'com\.wireguard\.android-[0-9.]*\.apk' | sort -uV | tail -1)
          curl -fsSL -o "$RUNNER_TEMP/wireguard.apk" "https://download.wireguard.com/android-client/$apk"
          echo "$apk: $(sha256sum "$RUNNER_TEMP/wireguard.apk" | cut -d' ' -f1)"
      - name: Publish to two blogs from the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: jekyll-poster
          script: |
            adb shell svc power stayon true
            adb logcat -c
            if [ -n "$WG_CONF" ]; then tools/wireguard-on-emulator.sh "$RUNNER_TEMP/wireguard.apk"; fi
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.app.jekyllposter.device.LiveOnTheDeviceTest "-Pandroid.testInstrumentationRunnerArguments.vpnTunnel=${WG_CONF:+proton}" "-Pandroid.testInstrumentationRunnerArguments.liveRepoA=$REPO_A" "-Pandroid.testInstrumentationRunnerArguments.liveTokenA=$TOKEN_A" "-Pandroid.testInstrumentationRunnerArguments.liveRepoB=$REPO_B" "-Pandroid.testInstrumentationRunnerArguments.liveTokenB=$TOKEN_B" || { adb logcat -d > app/build/device-logcat.txt; adb logcat -d -b crash; exit 1; }
      # The kept files (request records, the privacy report) go into a public artifact: refuse
      # them all if either token is anywhere in them.
      - name: Check the kept files hold no token
        id: scan
        if: always()
        run: |
          # File by file: the device's folder name has spaces. grep exits 1 for "not found";
          # anything else (2: unreadable) fails the step rather than passing as clean.
          mkdir -p app/build/request-record
          found=0
          while IFS= read -r -d '' file; do
            found=1
            set +e; grep -qF -e "$TOKEN_A" -e "$TOKEN_B" "$file"; status=$?; set -e
            if [ "$status" -ne 1 ]; then
              rm -rf app/build/request-record
              find app/build/outputs -path '*additional_output*' -type f -delete
              echo "::error::A kept file holds a token or couldn't be read ($status); none were uploaded."
              exit 1
            fi
            cp "$file" app/build/request-record/
            echo "$(basename "$file"): $(wc -l < "$file") lines, no token"
          done < <(find app/build/outputs -path '*additional_output*' -type f \( -name '*.jsonl' -o -name '*.json' \) -print0)
          [ "$found" = 1 ] || echo "::warning::No request record or report came back."
      - name: Keep the request record and the report
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: jekyll-poster-device-live
          path: |
            jekyll-poster/app/build/request-record/
            jekyll-poster/app/build/reports/androidTests/
            jekyll-poster/app/build/device-logcat.txt
          retention-days: 30
