name: Jekyll Poster

on:
  push:
    branches: [main]
    paths: ['jekyll-poster/**', '.github/workflows/jekyll-poster.yml']
  pull_request:
    branches: [main]
    paths: ['jekyll-poster/**', '.github/workflows/jekyll-poster.yml']

# Read-only unless a job asks for more; the build runs third-party plugins and dependencies.
permissions:
  contents: read

defaults:
  run:
    working-directory: jekyll-poster

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, unit tests and coverage
        # The GitHub App for "Sign in with GitHub" (docs/GITHUB_APP.md); without it, token sign-in only.
        env:
          CLIENT_ID: ${{ vars.JEKYLL_POSTER_CLIENT_ID }}
          APP_SLUG: ${{ vars.JEKYLL_POSTER_APP_SLUG }}
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify "-PgithubClientId=$CLIENT_ID" "-PgithubAppSlug=$APP_SLUG"
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jekyll-poster-debug-apk
          path: jekyll-poster/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jekyll-poster-reports
          path: |
            jekyll-poster/app/build/reports/tests/
            jekyll-poster/core/build/reports/tests/
            jekyll-poster/build/reports/kover/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/madCode/claude-playground/releases/download/jekyll-poster-debug/jekyll-poster-debug.apk
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which a phone with a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, and never cancelled: cancellation isn't instant, so two jobs overlap long
    # enough to collide on the release's assets (newspaperss #210). A later push waits its turn.
    concurrency:
      group: jekyll-poster-debug
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jekyll-poster-debug-apk
      - name: Update the jekyll-poster-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk jekyll-poster-debug.apk
          build="${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          # The same build under a numbered name, so a download can't be mistaken for an older one,
          # and the app's update check reads the build number from it.
          numbered="jekyll-poster-debug-$build.apk"
          cp jekyll-poster-debug.apk "$numbered"
          title="Jekyll Poster debug build $build · $short"
          notes="Build $build from main ($short). Installs as com.app.jekyllposter.debug."
          if gh release view jekyll-poster-debug > /dev/null 2>&1; then
            gh release upload jekyll-poster-debug jekyll-poster-debug.apk "$numbered" --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/jekyll-poster-debug" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit jekyll-poster-debug --title "$title" --notes "$notes"
            # Only the newest numbered copy stays.
            gh release view jekyll-poster-debug --json assets --jq '.assets[].name' \
              | { grep -E '^jekyll-poster-debug-[0-9]+\.apk$' || true; } | { grep -vx "$numbered" || true; } \
              | while read -r old; do gh release delete-asset jekyll-poster-debug "$old" -y; done
          else
            gh release create jekyll-poster-debug jekyll-poster-debug.apk "$numbered" --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
