name: Jekyll Poster device tests

# The app as installed, on an emulator: WorkManager, the Keystore, notifications and intents from
# other processes, which Robolectric only imitates. GitHub is a fake one on the device. Slower
# than the unit job (an emulator has to boot), so it runs on its own.
on:
  pull_request:
    branches: [main]
    paths: ['jekyll-poster/**', '.github/workflows/jekyll-poster-device.yml']
  push:
    branches: [main]
    paths: ['jekyll-poster/**', '.github/workflows/jekyll-poster-device.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: jekyll-poster

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # KVM is off by default on the runner, and the emulator is unusably slow without it.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # 36, not 37: there's no 37 system image yet.
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: jekyll-poster
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jekyll-poster-device-report
          path: jekyll-poster/app/build/reports/androidTests/
          retention-days: 14
