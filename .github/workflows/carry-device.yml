name: Carry device tests

# Carry as installed, on an emulator: the folder grant, WorkManager, a tap on a real notification
# in the system's shade, and a reboot, which Robolectric only imitates. Slower than the unit job
# (an emulator has to boot), so it runs on its own.
on:
  pull_request:
    branches: [main]
    paths: ['carry/**', '.github/workflows/carry-device.yml']
  push:
    branches: [main]
    paths: ['carry/**', '.github/workflows/carry-device.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: carry

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # KVM is off by default on the runner, and the emulator is unusably slow without it.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built without CI's run number, as a local build is: a numbered debug build asks GitHub for a
      # newer one and would try to update itself in the middle of the tests (SelfUpdaters).
      # Built before the emulator starts, so it isn't left waiting (and its screen locking) meanwhile.
      - name: Build the app and its device tests
        run: env -u GITHUB_RUN_NUMBER -u GITHUB_SHA ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # 36, not 37: there's no 37 system image yet.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: carry
          # The app's logcat goes in the report: an app that dies at start leaves no other trace.
          script: |
            adb shell svc power stayon true
            adb logcat -c
            env -u GITHUB_RUN_NUMBER -u GITHUB_SHA ./gradlew :app:connectedDebugAndroidTest || { adb logcat -d > app/build/device-logcat.txt; adb logcat -d -b crash; exit 1; }
            # Last, as it reboots the emulator: the hourly session check comes back on its own.
            tools/reboot-check.sh app/build/outputs/apk/debug/app-debug.apk || { adb logcat -d > app/build/device-logcat.txt; exit 1; }
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carry-device-report
          path: |
            carry/app/build/reports/androidTests/
            carry/app/build/device-logcat.txt
            carry/app/build/outputs/connected_android_test_additional_output/
          retention-days: 14
