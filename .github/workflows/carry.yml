name: Carry

on:
  push:
    branches: [main]
    paths: ['carry/**', '.github/workflows/carry.yml']
  pull_request:
    branches: [main]
    paths: ['carry/**', '.github/workflows/carry.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: carry

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, lint, tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: carry-debug-apk
          path: carry/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test reports, coverage and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: carry-reports
          path: |
            carry/app/build/reports/tests/
            carry/build/reports/kover/
            carry/app/build/screenshots/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/madCode/claude-playground/releases/download/carry-debug/carry-debug.apk
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which a phone with a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: carry-debug
      cancel-in-progress: true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: carry-debug-apk
      - name: Update the carry-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk carry-debug.apk
          build="${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          title="Carry debug build $build · $short"
          notes="Build $build from main ($short). Installs as com.app.carry.debug."
          if gh release view carry-debug > /dev/null 2>&1; then
            gh release upload carry-debug carry-debug.apk --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/carry-debug" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit carry-debug --title "$title" --notes "$notes"
          else
            gh release create carry-debug carry-debug.apk --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
